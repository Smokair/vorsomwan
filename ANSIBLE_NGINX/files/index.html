<html>
<head>
    <title>Ansible Nginx Installation Experiment 1</title>
</head>
<body>
    <h1>Installed by Ansible</h1>
    <h2>Experiment succeeded</h2>

    
    <p id="current-date"></p>

    <script>
                
        // Get the current date
        const today = new Date();

        // Format the date
        const formattedDate = today.toLocaleDateString("en-US", {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
            
        });

        // Display the date
        document.getElementById("current-date").textContent = formattedDate;
        
    </script>
</body>
</html>
